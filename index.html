  <!-- Script para cargar siempre fija la capa de Inmuebles -->
  <script>
    $(document).ready(function () {
      const cargarInmueblesFijos = setInterval(function () {
        if (typeof L !== "undefined" && typeof mapa !== "undefined" && mapa && mapa._leaflet_id) {
          clearInterval(cargarInmueblesFijos);

          $.getJSON("dist/layers/geojson/inmuebles.geojson", function (data) {
            const capaGeoJson = L.geoJSON(data, {
              pointToLayer: function (feature, latlng) {
                const cat = feature.properties.categoria;
                
                // Definimos colores según la categoría
                let colorFondo = "#34495e"; // Gris por defecto
                let icono = "fa-building";
                
                if (cat === "residencial") { colorFondo = "#27ae60"; icono = "fa-house"; }
                if (cat === "comercial") { colorFondo = "#2980b9"; icono = "fa-shop"; }
                if (cat === "terreno") { colorFondo = "#f39c12"; icono = "fa-tree"; }

                const iconoCustom = L.divIcon({
                  className: 'custom-div-icon',
                  html: `<div style='background-color:${colorFondo}; border: 2px solid #fff; border-radius: 50%; width: 30px; height: 30px; display:flex; align-items:center; justify-content:center; box-shadow: 0 2px 5px rgba(0,0,0,0.4);'>
                          <i class='fa-solid ${icono}' style='color:#fff; font-size:14px;'></i>
                        </div>`,
                  iconSize: [30, 30],
                  iconAnchor: [15, 15]
                });

                return L.marker(latlng, { icon: iconoCustom });
              },
              onEachFeature: function (feature, layer) {
                const p = feature.properties || {};
                const nombre = p.titulo || "Propiedad Disponible";

                layer.bindTooltip(nombre, {
                  permanent: false,
                  direction: 'top',
                  offset: [0, -10]
                });

                layer.on('click', function (e) {
                  L.DomEvent.stopPropagation(e);
                  if (typeof window.actualizarSidebarInmueble === "function") {
                    window.actualizarSidebarInmueble(p);
                  }
                });
              }
            });

            capaGeoJson.addTo(mapa);
            console.log("✅ Capa de Inmuebles cargada y fija en el mapa.");
          }).fail(function (jqXHR, textStatus, error) {
            console.error("❌ Error al cargar inmuebles.geojson:", textStatus, error);
          });
        }
      }, 200);
    });
  </script>
